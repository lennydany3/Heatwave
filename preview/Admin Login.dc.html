<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&amp;display=swap">
<style>
body{margin:0;background:#fff;color:#141414;font-family:Satoshi,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#141414;text-decoration:none}a:hover{color:#E5251B}
*{box-sizing:border-box}
input::placeholder{color:transparent}
@keyframes hwSpin{to{transform:rotate(360deg)}}
@keyframes hwUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap">
<div style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;padding:32px clamp(24px,5vw,72px)">
<div style="display:flex;align-items:center;gap:12px">
<span style="font-weight:900;font-size:20px;letter-spacing:-0.04em;display:flex;align-items:center;gap:6px">heatwave<span style="width:7px;height:7px;border-radius:999px;background:#E5251B"></span></span>
<span style="padding:3px 10px;border-radius:999px;border:1px solid #EDE6E3;font-size:11px;font-weight:700;letter-spacing:0.14em;color:#6B6B6B">ADMIN</span>
</div>
<div style="flex:1;display:flex;align-items:center;padding:48px 0">
<form onSubmit="{{ submit }}" novalidate="" style="width:100%;max-width:400px;margin:0 auto;animation:hwUp .6s ease both">
<h1 style="margin:0;font-size:clamp(36px,4.4vw,44px);line-height:1;letter-spacing:-0.04em;font-weight:900">Admin console</h1>
<p style="margin:12px 0 0;font-size:15px;color:#6B6B6B">Sign in with your organiser account.</p>
<div style="margin-top:36px;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
<div>
<div style="position:relative">
<input id="al-{{ f.key }}" type="{{ f.type }}" inputMode="{{ f.mode }}" value="{{ f.value }}" placeholder="{{ f.label }}" onChange="{{ f.onChange }}" onFocus="{{ f.onFocus }}" onBlur="{{ f.onBlur }}" style="width:100%;height:60px;padding:24px 72px 8px 16px;border:1px solid {{ f.border }};border-radius:12px;font:inherit;font-size:16px;color:#141414;background:#fff;outline:none;box-shadow:{{ f.ring }};letter-spacing:{{ f.ls }};transition:border-color .15s,box-shadow .15s">
<label for="al-{{ f.key }}" style="position:absolute;left:17px;top:{{ f.labelTop }};font-size:{{ f.labelSize }};color:{{ f.labelColor }};pointer-events:none;transition:all .15s ease">{{ f.label }}</label>
<sc-if value="{{ f.isPw }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ togglePw }}" style="all:unset;cursor:pointer;position:absolute;right:16px;top:20px;font-size:13px;font-weight:700;color:#6B6B6B" style-hover="color:#141414">{{ pwToggle }}</button></sc-if>
</div>
<sc-if value="{{ f.hint }}" hint-placeholder-val="{{ false }}"><div style="margin:6px 0 0 4px;font-size:13px;color:#6B6B6B">{{ f.hintText }}</div></sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><div style="margin-top:12px;display:flex;gap:8px;align-items:center;font-size:14px;color:#C8372D"><span style="width:6px;height:6px;border-radius:999px;background:#E5251B"></span>{{ err }}</div></sc-if>
<button type="submit" style="all:unset;cursor:pointer;box-sizing:border-box;margin-top:28px;width:100%;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-weight:700;font-size:16px;background:linear-gradient(90deg,#B71C14 50%,#E5251B 50%);background-size:202% 100%;background-position:100% 0;transition:background-position .4s ease" style-hover="background-position:0 0">
<sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">{{ spinner }}Signing in…</sc-if>
<sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">Sign in</sc-if>
</button>
<div style="margin-top:20px;display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#6B6B6B"><a href="#" style="color:#6B6B6B;font-weight:700">Forgot password?</a><span>Access is logged</span></div>
</form>
</div>
</div>
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<div style="flex:1 1 440px;min-width:0;background:#FAF7F5;border-left:1px solid #EDE6E3;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:72px clamp(32px,5vw,80px);min-height:100vh">
<svg viewBox="0 0 800 120" preserveAspectRatio="none" style="position:absolute;left:0;top:42%;width:100%;height:120px"><path d="M0 60 Q100 30 200 60 T400 60 T600 60 T800 60" fill="none" stroke="#E5251B" stroke-width="1.5" vector-effect="non-scaling-stroke"></path></svg>
<div style="position:relative;max-width:360px">
<div style="font-size:12px;font-weight:700;letter-spacing:0.14em;color:#6B6B6B">ORGANISER TOOLS</div>
<p style="margin:14px 0 0;font-size:22px;line-height:1.35;font-weight:500;letter-spacing:-0.01em">Manage events, bookings, check-ins and payouts from one place.</p>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: 'ops@heatwave.in', pw: '', code: '', show: false, focus: null, err: '', loading: false, narrow: false };
  componentDidMount() {
    this.onResize = () => { const n = window.innerWidth < 900; if (n !== this.state.narrow) this.setState({ narrow: n }); };
    window.addEventListener('resize', this.onResize); this.onResize();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  f(key, label, type, mode) {
    const v = this.state[key], foc = this.state.focus === key, up = foc || !!v, bad = !!this.state.err && key !== 'code';
    return { key, label, type, mode, value: v, isPw: key === 'pw', hint: key === 'code', hintText: 'Only if two-factor sign-in is on for your account',
      ls: key === 'code' && v ? '0.3em' : 'normal',
      border: bad || foc ? '#E5251B' : '#EDE6E3', ring: foc ? '0 0 0 3px rgba(229,37,27,.12)' : 'none',
      labelTop: up ? '9px' : '19px', labelSize: up ? '12px' : '16px', labelColor: bad ? '#C8372D' : foc ? '#E5251B' : '#6B6B6B',
      onChange: e => this.setState({ [key]: key === 'code' ? e.target.value.replace(/\D/g, '').slice(0, 6) : e.target.value, err: '' }),
      onFocus: () => this.setState({ focus: key }), onBlur: () => this.setState({ focus: null }) };
  }
  renderVals() {
    const s = this.state;
    return {
      wide: !s.narrow,
      fields: [this.f('email', 'Work email', 'email', 'email'), this.f('pw', 'Password', s.show ? 'text' : 'password', 'text'), this.f('code', '2FA code (optional)', 'text', 'numeric')],
      pwToggle: s.show ? 'Hide' : 'Show', togglePw: () => this.setState(x => ({ show: !x.show })),
      hasErr: !!s.err, err: s.err, loading: s.loading, idle: !s.loading,
      submit: e => { e.preventDefault(); if (s.loading) return;
        if (!/^\S+@\S+\.\S+$/.test(s.email) || s.pw.length < 6) return this.setState({ err: 'Incorrect email or password' });
        if (s.code && s.code.length !== 6) return this.setState({ err: 'Enter the 6-digit code from your authenticator app' });
        this.setState({ loading: true }); setTimeout(() => { window.location.href = 'Admin Overview.dc.html'; }, 1100); },
      spinner: React.createElement('span', { style: { width: 18, height: 18, borderRadius: 999, border: '2px solid rgba(255,255,255,.35)', borderTopColor: '#fff', animation: 'hwSpin .7s linear infinite', display: 'inline-block' } })
    };
  }
}
</script>
</body>
</html>
