<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&amp;display=swap">
<style>
body{margin:0;background:#fff;color:#141414;font-family:Satoshi,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#141414;text-decoration:none}a:hover{color:#E5251B}
*{box-sizing:border-box}
input::placeholder{color:transparent}
@keyframes hwDrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes hwSpin{to{transform:rotate(360deg)}}
@keyframes hwUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap">
<div style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;padding:32px clamp(24px,5vw,72px)">
<a href="#" style="font-weight:900;font-size:20px;letter-spacing:-0.04em;display:flex;align-items:center;gap:6px">heatwave<span style="width:7px;height:7px;border-radius:999px;background:#E5251B"></span></a>
<div style="flex:1;display:flex;align-items:center;padding:48px 0">
<form onSubmit="{{ submit }}" style="width:100%;max-width:400px;margin:0 auto;animation:hwUp .6s ease both" novalidate="">
<h1 style="margin:0;font-size:clamp(40px,5vw,52px);line-height:1;letter-spacing:-0.045em;font-weight:900">Welcome back</h1>
<p style="margin:12px 0 0;font-size:16px;color:#6B6B6B">Log in to see your tickets and bookings.</p>
<div style="margin-top:36px;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{ fields }}" as="f" hint-placeholder-count="2">
<div style="position:relative">
<input id="cl-{{ f.key }}" type="{{ f.type }}" value="{{ f.value }}" placeholder="{{ f.label }}" autoComplete="{{ f.ac }}" onChange="{{ f.onChange }}" onFocus="{{ f.onFocus }}" onBlur="{{ f.onBlur }}" style="width:100%;height:60px;padding:24px 72px 8px 16px;border:1px solid {{ f.border }};border-radius:12px;font:inherit;font-size:16px;color:#141414;background:#fff;outline:none;box-shadow:{{ f.ring }};transition:border-color .15s,box-shadow .15s">
<label for="cl-{{ f.key }}" style="position:absolute;left:17px;top:{{ f.labelTop }};font-size:{{ f.labelSize }};color:{{ f.labelColor }};pointer-events:none;transition:all .15s ease">{{ f.label }}</label>
<sc-if value="{{ f.isPw }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ togglePw }}" style="all:unset;cursor:pointer;position:absolute;right:16px;top:20px;font-size:13px;font-weight:700;color:#6B6B6B" style-hover="color:#141414">{{ pwToggle }}</button></sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><div style="margin-top:12px;display:flex;gap:8px;align-items:center;font-size:14px;color:#C8372D"><span style="width:6px;height:6px;border-radius:999px;background:#E5251B"></span>{{ err }}</div></sc-if>
<div style="margin-top:14px;display:flex;justify-content:flex-end"><a href="#" style="font-size:14px;font-weight:700;color:#E5251B">Forgot password?</a></div>
<button type="submit" style="all:unset;cursor:pointer;box-sizing:border-box;margin-top:24px;width:100%;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-weight:700;font-size:16px;background:linear-gradient(90deg,#B71C14 50%,#E5251B 50%);background-size:202% 100%;background-position:100% 0;transition:background-position .4s ease" style-hover="background-position:0 0">
<sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">{{ spinner }}Logging in…</sc-if>
<sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">Log in</sc-if>
</button>
<div style="margin:28px 0;display:flex;align-items:center;gap:14px;font-size:13px;color:#6B6B6B"><span style="flex:1;height:1px;background:#EDE6E3"></span>or<span style="flex:1;height:1px;background:#EDE6E3"></span></div>
<button type="button" onClick="{{ google }}" style="all:unset;cursor:pointer;box-sizing:border-box;width:100%;height:56px;border-radius:999px;border:1px solid #EDE6E3;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:15px;transition:background .2s,transform .2s" style-hover="background:#FAF7F5">
<span style="width:20px;height:20px;border-radius:999px;border:1px solid #EDE6E3;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900">G</span>Continue with Google</button>
<p style="margin:32px 0 0;text-align:center;font-size:15px;color:#6B6B6B">New here? <a href="#" style="font-weight:700;color:#141414">Create an account</a></p>
</form>
</div>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}"><div style="height:80px;margin:0 calc(-1 * clamp(24px,5vw,72px)) -32px;overflow:hidden;position:relative">{{ wave }}</div></sc-if>
</div>
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<div style="flex:1 1 520px;min-width:0;background:#FAF7F5;border-left:1px solid #EDE6E3;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:72px clamp(32px,5vw,88px);min-height:100vh">
<div style="position:absolute;left:0;right:0;top:38%;height:140px;overflow:hidden;pointer-events:none">{{ wave }}</div>
<div style="position:relative;font-size:12px;font-weight:700;letter-spacing:0.14em;color:#6B6B6B">HEATWAVE TICKETS</div>
<h2 style="position:relative;margin:16px 0 0;font-size:clamp(40px,4.4vw,64px);line-height:.98;letter-spacing:-0.05em;font-weight:900;max-width:11ch">Your next event, one tap away.</h2>
<div style="position:relative;margin-top:56px;max-width:420px;background:#fff;border:1px solid #EDE6E3;border-radius:12px;overflow:hidden;transform:rotate(-2deg);animation:hwUp .8s .15s ease both">
<div style="display:flex">
<div style="width:6px;background:#E5251B"></div>
<div style="flex:1;padding:22px 24px">
<div style="font-size:11px;font-weight:700;letter-spacing:0.14em;color:#E5251B">E-TICKET</div>
<div style="margin-top:6px;font-size:20px;font-weight:900;letter-spacing:-0.025em">Bay Beats Festival</div>
<div style="margin-top:14px;display:flex;gap:24px">
<div><div style="font-size:10px;font-weight:700;letter-spacing:0.14em;color:#6B6B6B">DATE</div><div style="margin-top:3px;font-size:14px;font-weight:700">Sat, 6 Mar</div></div>
<div><div style="font-size:10px;font-weight:700;letter-spacing:0.14em;color:#6B6B6B">VENUE</div><div style="margin-top:3px;font-size:14px;font-weight:700">Chennai Trade Centre</div></div>
</div>
</div>
<div style="width:96px;border-left:1px dashed #EDE6E3;display:flex;align-items:center;justify-content:center;background:#FAF7F5"><div style="width:56px;height:56px;border-radius:6px;background:repeating-linear-gradient(90deg,#141414 0 3px,transparent 3px 6px),repeating-linear-gradient(0deg,#141414 0 3px,transparent 3px 6px);background-blend-mode:multiply;opacity:.85"></div></div>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;demoState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;error&quot;,&quot;loading&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { email: 'priya.r@example.com', pw: '', show: false, focus: null, err: '', loading: false, narrow: false };
  componentDidMount() {
    this.onResize = () => { const n = window.innerWidth < 900; if (n !== this.state.narrow) this.setState({ narrow: n }); };
    window.addEventListener('resize', this.onResize); this.onResize();
    this.applyDemo();
  }
  componentDidUpdate(pp) { if (pp.demoState !== this.props.demoState) this.applyDemo(); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  applyDemo() {
    const d = this.props.demoState;
    if (d === 'error') this.setState({ pw: 'summer', err: 'Incorrect email or password', loading: false });
    else if (d === 'loading') this.setState({ pw: 'heatwave', err: '', loading: true });
    else this.setState({ err: '', loading: false });
  }
  f(key, label, type, ac) {
    const v = this.state[key], foc = this.state.focus === key, up = foc || !!v, bad = !!this.state.err;
    return { key, label, type, ac, value: v, isPw: key === 'pw',
      border: bad || foc ? '#E5251B' : '#EDE6E3', ring: foc ? '0 0 0 3px rgba(229,37,27,.12)' : 'none',
      labelTop: up ? '9px' : '19px', labelSize: up ? '12px' : '16px', labelColor: bad ? '#C8372D' : foc ? '#E5251B' : '#6B6B6B',
      onChange: e => this.setState({ [key]: e.target.value, err: '' }), onFocus: () => this.setState({ focus: key }), onBlur: () => this.setState({ focus: null }) };
  }
  renderVals() {
    const s = this.state;
    const path = 'M0 70 ' + Array.from({ length: 8 }, (_, i) => (i === 0 ? 'Q100 30 200 70 ' : 'T' + 200 * (i + 1) + ' 70 ')).join('');
    return {
      narrow: s.narrow, wide: !s.narrow,
      fields: [this.f('email', 'Email', 'email', 'email'), this.f('pw', 'Password', s.show ? 'text' : 'password', 'current-password')],
      pwToggle: s.show ? 'Hide' : 'Show', togglePw: () => this.setState(x => ({ show: !x.show })),
      hasErr: !!s.err, err: s.err, loading: s.loading, idle: !s.loading,
      submit: e => { e.preventDefault(); if (s.loading) return;
        if (!/^\S+@\S+\.\S+$/.test(s.email) || s.pw.length < 6) return this.setState({ err: 'Incorrect email or password' });
        this.setState({ loading: true, err: '' }); setTimeout(() => { window.location.href = 'Customer Dashboard.dc.html'; }, 1200); },
      google: () => { window.location.href = 'Customer Dashboard.dc.html'; },
      spinner: React.createElement('span', { style: { width: 18, height: 18, borderRadius: 999, border: '2px solid rgba(255,255,255,.35)', borderTopColor: '#fff', animation: 'hwSpin .7s linear infinite', display: 'inline-block' } }),
      wave: React.createElement('svg', { viewBox: '0 0 1600 140', preserveAspectRatio: 'none', style: { width: '200%', height: '100%', display: 'block', animation: 'hwDrift 24s linear infinite' } },
        React.createElement('path', { d: path, fill: 'none', stroke: '#E5251B', strokeWidth: 1.5, vectorEffect: 'non-scaling-stroke' }))
    };
  }
}
</script>
</body>
</html>
